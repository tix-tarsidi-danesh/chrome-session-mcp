name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no network, no Chrome)
        run: python -m unittest discover -s tests -v
      - name: Package builds and the console script starts
        run: |
          python -m pip install .
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"ping"}' | CHROME_SESSION_MCP_CONFIG=/nonexistent chrome-session-mcp
